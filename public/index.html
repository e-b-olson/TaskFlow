<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Smart Task Manager</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <!-- Auth Section -->
    <div id="auth-section" class="section">
      <div class="auth-container">
        <h1>TaskFlow</h1>
        <p class="subtitle">Smart Task Management</p>
        <div id="auth-forms">
          <div id="login-form" class="auth-form">
            <h2>Login</h2>
            <input type="text" id="login-username" placeholder="Username or email" autocomplete="username">
            <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
            <button onclick="handleLogin()">Login</button>
            <p class="switch-auth">Don't have an account? <a href="#" onclick="showRegister()">Register</a></p>
          </div>
          <div id="register-form" class="auth-form hidden">
            <h2>Register</h2>
            <input type="text" id="reg-username" placeholder="Username" autocomplete="username">
            <input type="email" id="reg-email" placeholder="Email" autocomplete="email">
            <input type="password" id="reg-password" placeholder="Password (min 6 chars)" autocomplete="new-password">
            <button onclick="handleRegister()">Register</button>
            <p class="switch-auth">Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
          </div>
          <div id="auth-error" class="error hidden"></div>
        </div>
      </div>
    </div>

    <!-- Main App Section -->
    <div id="main-section" class="section hidden">
      <header>
        <h1>TaskFlow</h1>
        <div class="header-right">
          <span id="user-greeting"></span>
          <button onclick="handleLogout()" class="btn-secondary">Logout</button>
        </div>
      </header>

      <nav class="tabs">
        <button class="tab active" onclick="switchTab('lists')">My Lists</button>
        <button class="tab" onclick="switchTab('tasks')">All Tasks</button>
        <button class="tab" onclick="switchTab('smart')">Smart Builder</button>
      </nav>

      <!-- Lists Tab -->
      <div id="lists-tab" class="tab-content">
        <div class="toolbar">
          <button onclick="showListModal()" class="btn-primary">+ New List</button>
        </div>
        <div id="lists-container"></div>
        <div id="list-detail" class="hidden">
          <button onclick="closeListDetail()" class="btn-secondary">&larr; Back to Lists</button>
          <div id="list-detail-content"></div>
        </div>
      </div>

      <!-- Tasks Tab -->
      <div id="tasks-tab" class="tab-content hidden">
        <div class="toolbar">
          <button onclick="showTaskModal()" class="btn-primary">+ New Task</button>
          <div class="filters">
            <select id="filter-status" onchange="loadTasks()">
              <option value="">All Status</option>
              <option value="PENDING">Pending</option>
              <option value="IN_PROGRESS">In Progress</option>
              <option value="COMPLETE">Complete</option>
            </select>
            <select id="filter-priority" onchange="loadTasks()">
              <option value="">All Priority</option>
              <option value="HIGH">High</option>
              <option value="MEDIUM">Medium</option>
              <option value="LOW">Low</option>
            </select>
            <select id="filter-effort" onchange="loadTasks()">
              <option value="">All Effort</option>
              <option value="HIGH">High</option>
              <option value="MEDIUM">Medium</option>
              <option value="LOW">Low</option>
            </select>
            <select id="sort-by" onchange="loadTasks()">
              <option value="created_at">Date Created</option>
              <option value="priority">Priority</option>
              <option value="deadline">Deadline</option>
              <option value="time_estimate_minutes">Time Estimate</option>
              <option value="status">Status</option>
              <option value="effort">Effort</option>
              <option value="title">Title</option>
            </select>
            <select id="sort-order" onchange="loadTasks()">
              <option value="desc">Newest First</option>
              <option value="asc">Oldest First</option>
            </select>
            <input type="text" id="search-input" placeholder="Search..." oninput="debounceSearch()">
          </div>
        </div>
        <div id="tasks-list" class="tasks-grid"></div>
      </div>

      <!-- Smart Builder Tab -->
      <div id="smart-tab" class="tab-content hidden">
        <div class="smart-builder">
          <h2>Smart List Builder</h2>
          <p>Tell me how much time you have, and I'll build a task list optimized for priority, deadlines, and effort.</p>
          <div class="smart-form">
            <div class="form-group">
              <label for="smart-minutes">Available Time (minutes)</label>
              <input type="number" id="smart-minutes" min="5" step="5" value="60">
            </div>
            <div class="form-group">
              <label for="smart-priority">Priority Filter (optional)</label>
              <select id="smart-priority">
                <option value="">Any Priority</option>
                <option value="HIGH">High Only</option>
                <option value="MEDIUM">Medium Only</option>
                <option value="LOW">Low Only</option>
              </select>
            </div>
            <div class="form-group">
              <label for="smart-effort">Effort Filter (optional)</label>
              <select id="smart-effort">
                <option value="">Any Effort</option>
                <option value="LOW">Low Effort Only</option>
                <option value="MEDIUM">Medium Effort Only</option>
                <option value="HIGH">High Effort Only</option>
              </select>
            </div>
            <div class="form-group">
              <label for="smart-name">List Name (leave blank to just preview)</label>
              <input type="text" id="smart-name" placeholder="e.g. My Afternoon Tasks">
            </div>
            <button onclick="generateSmartList()" class="btn-primary">Generate List</button>
          </div>
          <div id="smart-results" class="hidden"></div>
        </div>
      </div>
    </div>

    <!-- Task Modal -->
    <div id="task-modal" class="modal hidden">
      <div class="modal-content">
        <h2 id="task-modal-title">New Task</h2>
        <input type="hidden" id="task-edit-id">
        <div class="form-group">
          <label for="task-title">Title *</label>
          <input type="text" id="task-title" placeholder="Task title">
        </div>
        <div class="form-group">
          <label for="task-description">Description</label>
          <textarea id="task-description" placeholder="Optional description"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="task-status">Status</label>
            <select id="task-status">
              <option value="PENDING">Pending</option>
              <option value="IN_PROGRESS">In Progress</option>
              <option value="COMPLETE">Complete</option>
            </select>
          </div>
          <div class="form-group">
            <label for="task-priority">Priority</label>
            <select id="task-priority">
              <option value="HIGH">High</option>
              <option value="MEDIUM" selected>Medium</option>
              <option value="LOW">Low</option>
            </select>
          </div>
          <div class="form-group">
            <label for="task-effort">Effort</label>
            <select id="task-effort">
              <option value="HIGH">High</option>
              <option value="MEDIUM" selected>Medium</option>
              <option value="LOW">Low</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="task-deadline">Deadline</label>
            <input type="datetime-local" id="task-deadline">
          </div>
          <div class="form-group">
            <label for="task-estimate">Time Estimate (min)</label>
            <input type="number" id="task-estimate" min="1" placeholder="e.g. 30">
          </div>
          <div class="form-group">
            <label for="task-cost">Cost ($)</label>
            <input type="number" id="task-cost" min="0" step="0.01" placeholder="Optional">
          </div>
        </div>
        <div class="form-group">
          <label for="task-materials">Materials / Supplies</label>
          <textarea id="task-materials" placeholder="Optional - list any needed materials"></textarea>
        </div>
        <div class="modal-actions">
          <button onclick="closeTaskModal()" class="btn-secondary">Cancel</button>
          <button onclick="saveTask()" class="btn-primary">Save</button>
        </div>
      </div>
    </div>

    <!-- List Modal (Create / Edit) -->
    <div id="list-modal" class="modal hidden">
      <div class="modal-content">
        <h2 id="list-modal-title">New List</h2>
        <input type="hidden" id="list-edit-id">
        <div class="form-group">
          <label for="list-name">List Name *</label>
          <input type="text" id="list-name" placeholder="My Task List">
        </div>
        <div class="form-group">
          <label for="list-description">Description</label>
          <textarea id="list-description" placeholder="Optional description"></textarea>
        </div>
        <div class="form-group">
          <label>Select Tasks to Include</label>
          <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem;">
            <input type="text" id="list-task-search" placeholder="Search tasks..." oninput="filterListTasks()" style="flex: 1;">
            <button type="button" class="btn-primary btn-small" onclick="showInlineTaskForm()">+ New Task</button>
          </div>
          <div id="inline-task-form" class="hidden" style="border: 1px solid var(--border); border-radius: var(--radius); padding: 0.75rem; margin-bottom: 0.5rem; background: var(--bg);">
            <div class="form-group" style="margin-bottom: 0.5rem;">
              <input type="text" id="inline-task-title" placeholder="Task title *">
            </div>
            <div class="form-row" style="margin-bottom: 0.5rem;">
              <div class="form-group" style="margin-bottom: 0;">
                <select id="inline-task-priority">
                  <option value="HIGH">High Priority</option>
                  <option value="MEDIUM" selected>Medium Priority</option>
                  <option value="LOW">Low Priority</option>
                </select>
              </div>
              <div class="form-group" style="margin-bottom: 0;">
                <select id="inline-task-effort">
                  <option value="HIGH">High Effort</option>
                  <option value="MEDIUM" selected>Medium Effort</option>
                  <option value="LOW">Low Effort</option>
                </select>
              </div>
              <div class="form-group" style="margin-bottom: 0;">
                <input type="number" id="inline-task-estimate" min="1" placeholder="Minutes">
              </div>
            </div>
            <div style="display: flex; gap: 0.5rem;">
              <button type="button" class="btn-primary btn-small" onclick="saveInlineTask()">Add Task</button>
              <button type="button" class="btn-secondary btn-small" onclick="hideInlineTaskForm()">Cancel</button>
            </div>
          </div>
          <div id="list-task-selector" class="task-selector"></div>
        </div>
        <div class="modal-actions">
          <button onclick="closeListModal()" class="btn-secondary">Cancel</button>
          <button onclick="saveList()" class="btn-primary" id="list-save-btn">Create</button>
        </div>
      </div>
    </div>

    <!-- Add to List Modal -->
    <div id="add-to-list-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Add Task to List</h2>
        <div id="available-lists"></div>
        <div class="modal-actions">
          <button onclick="closeAddToListModal()" class="btn-secondary">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
